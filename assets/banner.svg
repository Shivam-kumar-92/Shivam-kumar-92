<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D172A"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.25" r="0.45">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.72" r="0.42">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background & Subtle Grid -->
  <rect width="1200" height="270" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="270" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="270" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="270" rx="16" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="268" rx="15" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Right-side Stylized HA Network Topology Graphic -->
  <g opacity="0.9">
    <!-- Links -->
    <line x1="930" y1="68" x2="860" y2="132" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
    <line x1="930" y1="68" x2="1000" y2="132" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
    <line x1="860" y1="132" x2="1000" y2="132" stroke="#22C55E" stroke-width="2" opacity="0.85"/>
    <line x1="860" y1="132" x2="930" y2="202" stroke="#818CF8" stroke-width="1.8" opacity="0.75"/>
    <line x1="1000" y1="132" x2="930" y2="202" stroke="#818CF8" stroke-width="1.8" opacity="0.75"/>
    <line x1="1000" y1="132" x2="1105" y2="132" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Cloud / ISP Node -->
    <rect x="875" y="44" width="110" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="930" y="64" text-anchor="middle" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">AWS / ISP EDGE</text>

    <!-- R1 Active -->
    <rect x="802" y="114" width="116" height="36" rx="8" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="816" cy="132" r="4" fill="#22C55E"/>
    <text x="866" y="136" text-anchor="middle" fill="#DCFCE7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">R1 ACTIVE</text>

    <!-- R2 Standby -->
    <rect x="942" y="114" width="116" height="36" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="956" cy="132" r="4" fill="#38BDF8"/>
    <text x="1006" y="136" text-anchor="middle" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">R2 STANDBY</text>

    <!-- Bastion Node -->
    <rect x="1082" y="114" width="84" height="36" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="1124" y="136" text-anchor="middle" fill="#FEF3C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">BASTION</text>

    <!-- Core Switch / VLANs -->
    <rect x="855" y="186" width="150" height="34" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
    <text x="930" y="207" text-anchor="middle" fill="#E0E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">HSRP v2 · VLANs</text>

    <!-- Telemetry Caption -->
    <text x="975" y="244" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">SLA 99.99% · OSPF AREA 0 · ZERO-TRUST SSH</text>
  </g>

  <!-- Status Pill -->
  <rect x="52" y="38" width="292" height="28" rx="14" fill="#052E16" stroke="#22C55E" stroke-opacity="0.55" stroke-width="1.2"/>
  <circle cx="70" cy="52" r="4.5" fill="#22C55E"/>
  <text x="84" y="56" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.06em">NOC · INFRASTRUCTURE · SRE</text>

  <!-- Main Heading -->
  <text x="52" y="122" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.02em">Shivam Kumar</text>

  <!-- Subtitle -->
  <text x="52" y="158" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">Automating Network Reliability, Packet Forensics &amp; Cloud Infrastructure</text>

  <!-- Bottom Skill Chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <rect x="52" y="186" width="144" height="30" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="124" y="205" text-anchor="middle" fill="#7DD3FC">Python · Linux</text>

    <rect x="208" y="186" width="166" height="30" rx="7" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.55"/>
    <text x="291" y="205" text-anchor="middle" fill="#86EFAC">Cisco HSRP · OSPF</text>

    <rect x="386" y="186" width="176" height="30" rx="7" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.55"/>
    <text x="474" y="205" text-anchor="middle" fill="#C7D2FE">Wireshark · tshark</text>

    <rect x="574" y="186" width="156" height="30" rx="7" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.55"/>
    <text x="652" y="205" text-anchor="middle" fill="#FDE68A">AWS · Terraform</text>
  </g>
</svg>
